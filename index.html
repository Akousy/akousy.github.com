<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Page protégée</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div id="content">Déchiffrement...</div>

<script>
// Contenu HTML chiffré
const encryptedData = "U2FsdGVkX19V2T9Z2k4C8+v5Y7yWAD80U5BzH18JS8RkZDzHCD01yeK1cJQ2Nfq6M/5h72pcMK6gD7fQ5n0iQg==";

const pass = sessionStorage.getItem("sitePass");
if(!pass){
  window.location.href = "login.html";
} else {
  try {
    const bytes = CryptoJS.AES.decrypt(encryptedData, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);
    if(text){
      document.getElementById("content").innerHTML = text;
    } else {
      document.getElementById("content").innerHTML = "Mot de passe incorrect.";
    }
  } catch {
    document.getElementById("content").innerHTML = "Erreur de déchiffrement.";
  }
}
</script>
</body>
</html>
