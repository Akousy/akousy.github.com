<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Page protégéennn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div id="content">Déchiffrement...</div>

<script>
const encryptedData = "U2FsdGVkX18HL4tnWx2Jlrh9e1VKjEyR6ZsmL/x5PJU=";

const pass = sessionStorage.getItem("sitePass");
if(!pass){
  window.location.href = "login.html";
} else {
  try {
    const bytes = CryptoJS.AES.decrypt(encryptedData, pass);
    const text = bytes.toString(CryptoJS.enc.Utf8);
    if(text){
      document.getElementById("content").innerHTML = text;
    } else {
      document.getElementById("content").innerHTML = "Mot de passe incorrect.";
    }
  } catch {
    document.getElementById("content").innerHTML = "Erreur de déchiffrement.";
  }
}
</script>
</body>
</html>
