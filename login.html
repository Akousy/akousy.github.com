<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Login</title>
</head>
<body>
  <h2>Test de mot de passe</h2>
  <input type="password" id="password" placeholder="Entrez le mot de passe">
  <button onclick="check()">Vérifier</button>

  <script>
    const validHash = "c2a71d7efbb1f36c5055f7a5dbbeabc16cd1fa3b9e1a0c3fbc35cc2f21f6d52d";

    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function check() {
      const input = document.getElementById("password").value;
      const hash = await sha256(input);
      alert("Hash généré : " + hash);
      alert("Hash attendu : " + validHash);
      if (hash === validHash) {
        alert("✅ Mot de passe correct !");
      } else {
        alert("❌ Mot de passe incorrect !");
      }
    }
  </script>
</body>
</html>
